[package]
name = "omk"
version = "0.1.0"
edition = "2021"
description = "Standalone local knowledge vault skill with MCP Vault Server and Session Proxy for AI agents"
license = "MIT"

[lib]
name = "omk"
path = "src/lib.rs"

[[bin]]
name = "omk"
path = "src/main.rs"

[[test]]
name = "integration_test"
path = "../tests/integration_test.rs"

[dependencies]
omk-core = { path = "../core" }
